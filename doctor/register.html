<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor & Clinic Onboarding Registration | ApoCare Network</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: linear-gradient(180deg, #EDF4FA 0%, #FEFCFB 100%); min-height: 100vh; display: flex; flex-direction: column;">

<!-- Header Navigation Bar -->
<header class="header-navbar">
    <div class="container">
        <div class="nav-container">
            <a href="../index.html" class="brand-logo">
                <img src="../assets/images/logo.svg" alt="ApoCare" height="48">
            </a>

            <div class="nav-actions">
                <a href="../auth/login.html" class="btn btn-outline btn-sm">Doctor Sign In</a>
            </div>
        </div>
    </div>
</header>

<div class="container" style="padding: 40px 16px 80px; max-width: 720px;">
    <div style="background: #FFFFFF; border: 1px solid #E1E8EE; border-radius: 24px; padding: 36px; box-shadow: 0 15px 35px -5px rgba(10, 17, 40, 0.08);">
        <div style="text-align: center; margin-bottom: 28px;">
            <span class="section-tag" style="background: #E8F0F7; color: #034078; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 9999px;">FOR DOCTORS & CLINICS</span>
            <h1 style="font-size: 24px; font-weight: 800; color: #0A1128; margin: 10px 0 6px;">Join the ApoCare Specialist Network</h1>
            <p style="color: #64748B; font-size: 14px; margin: 0;">Get your practice verified, streamline patient queues with zero-wait passes, and receive direct digital payouts.</p>
        </div>

        <form id="doctorRegisterForm">
            <!-- Medical Practitioner Info -->
            <h3 style="font-size: 16px; font-weight: 800; color: #0A1128; margin: 0 0 14px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px;">1. Practitioner Credentials</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div>
                    <label for="docName" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Full Name (with Prefix) *</label>
                    <input type="text" id="docName" required placeholder="Dr. Firstname Lastname" value="Dr. Bikram Das" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
                <div>
                    <label for="docRegNumber" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">WBMC / NMC Reg Number *</label>
                    <input type="text" id="docRegNumber" required placeholder="WBMC-XXXXX" value="WBMC-99412" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div>
                    <label for="docSpecialization" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Specialization *</label>
                    <select id="docSpecialization" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; box-sizing: border-box;">
                        <option value="Cardiologist">Cardiologist</option>
                        <option value="Dermatologist">Dermatologist</option>
                        <option value="Neurologist">Neurologist</option>
                        <option value="Pediatrician">Pediatrician</option>
                        <option value="Orthopedic">Orthopedic</option>
                        <option value="Gynecologist">Gynecologist</option>
                        <option value="Dentist">Dentist</option>
                        <option value="General Physician" selected>General Physician</option>
                        <option value="ENT Specialist">ENT Specialist</option>
                        <option value="Ophthalmologist">Ophthalmologist</option>
                    </select>
                </div>
                <div>
                    <label for="docExperience" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Experience (Years) *</label>
                    <input type="number" id="docExperience" min="1" max="60" value="8" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
                <div>
                    <label for="docFee" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Visiting Fee (₹) *</label>
                    <input type="number" id="docFee" min="50" max="5000" step="50" value="300" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label for="docQualification" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Medical Qualifications *</label>
                <input type="text" id="docQualification" required placeholder="e.g. MBBS, MD (General Medicine)" value="MBBS, MD" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>

            <!-- Clinic & Practice Info -->
            <h3 style="font-size: 16px; font-weight: 800; color: #0A1128; margin: 0 0 14px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px;">2. Clinic / Hospital Practice Details</h3>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div>
                    <label for="docClinicName" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Clinic / Hospital Name *</label>
                    <input type="text" id="docClinicName" required value="Sammilani Health Center" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
                <div>
                    <label for="docLocation" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">City / Region *</label>
                    <select id="docLocation" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; box-sizing: border-box;">
                        <option value="Bankura" selected>Bankura</option>
                        <option value="Durgapur">Durgapur</option>
                        <option value="Bishnupur">Bishnupur</option>
                        <option value="Asansol">Asansol</option>
                        <option value="Kolkata">Kolkata</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 14px;">
                <label for="docAddress" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Clinic Street Address *</label>
                <input type="text" id="docAddress" required value="Nutanganj Main Road, Bankura" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>

            <!-- Login Credentials -->
            <h3 style="font-size: 16px; font-weight: 800; color: #0A1128; margin: 0 0 14px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px;">3. Account Login Details</h3>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px;">
                <div>
                    <label for="docEmail" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Professional Email *</label>
                    <input type="email" id="docEmail" required value="dr.bikram@apocare.com" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
                <div>
                    <label for="docPassword" style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">Account Password *</label>
                    <input type="password" id="docPassword" required value="Doctor@123" style="width: 100%; padding: 10px 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(3, 64, 120, 0.3);">
                Submit Registration for Medical Council Verification →
            </button>
        </form>
    </div>
</div>

<!-- Core Scripts -->
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('doctorRegisterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('docName').value.trim();
    const registration_number = document.getElementById('docRegNumber').value.trim();
    const specialization = document.getElementById('docSpecialization').value;
    const experience_years = Number(document.getElementById('docExperience').value);
    const visiting_charge = Number(document.getElementById('docFee').value);
    const qualification = document.getElementById('docQualification').value.trim();
    const clinic_name = document.getElementById('docClinicName').value.trim();
    const location = document.getElementById('docLocation').value;
    const address = document.getElementById('docAddress').value.trim();
    const email = document.getElementById('docEmail').value.trim();
    const password = document.getElementById('docPassword').value.trim();

    // Add Doctor to LocalStorage DB
    const newDoc = window.apoDB.addDoctor({
      name,
      registration_number,
      specialization,
      experience_years,
      visiting_charge,
      qualification,
      clinic_name,
      type: 'Clinic',
      location,
      address,
      contact: '9800000099',
      email,
      about: `Practicing ${specialization} with ${experience_years} years of healthcare experience. Registered under ${registration_number}.`,
      availability_days: 'Mon, Wed, Fri',
      availability_time: '10:00 AM - 4:00 PM',
      slot_duration_minutes: 20,
      distance_km: 2.1,
      image_url: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=400',
      rating: 5.0,
      review_count: 0,
      verification_status: 'Pending'
    });

    // Add User
    const nextUserId = Math.max(...window.apoDB.data.users.map(u => u.user_id), 0) + 1;
    window.apoDB.data.users.push({
      user_id: nextUserId,
      name,
      email,
      mobile: '9800000099',
      password,
      role: 'doctor',
      status: 'active',
      doctor_id: newDoc.doctor_id,
      created_at: new Date().toISOString()
    });
    window.apoDB.save();

    // Add Notification for Admin
    window.apoDB.addNotification({
      user_id: 1,
      role: 'admin',
      title: 'New Doctor Application',
      message: `${name} (${specialization}, Reg: ${registration_number}) submitted registration for verification.`,
      type: 'warning',
      link: 'admin/doctors.html'
    });

    window.showToast('Application submitted! Awaiting Medical Council verification by Admin.', 'success');
    setTimeout(() => {
        window.location.href = '../admin/doctors.html';
    }, 1200);
});
</script>
</body>
</html>
