<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Directory | ApoCare Doctor Panel</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

<div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

    <div class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <div class="topbar-page-title">Doctor's Registered Patients Directory</div>
            </div>
        </header>

        <main class="dashboard-content">
            <div style="background: #FFFFFF; border: 1px solid #E1E8EE; border-radius: 18px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid #F1F5F9; color: #64748B; font-size: 12px; text-transform: uppercase;">
                                <th style="padding: 12px 14px;">Patient Name</th>
                                <th style="padding: 12px 14px;">Gender / Age</th>
                                <th style="padding: 12px 14px;">Contact Mobile</th>
                                <th style="padding: 12px 14px;">Blood Group</th>
                                <th style="padding: 12px 14px;">Last Consultation</th>
                                <th style="padding: 12px 14px; text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="docPatientsTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Core Scripts -->
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!window.apoAuth.isLoggedIn()) window.apoAuth.loginDemo('doctor');
    window.apoDash.renderSidebar('doctor', 'patients');

    const patients = window.apoDB.data.patients;
    const tbody = document.getElementById('docPatientsTableBody');

    tbody.innerHTML = patients.map(p => `
        <tr style="border-bottom: 1px solid #F1F5F9;">
            <td style="padding: 14px; font-weight: 700; color: #0A1128;">${p.name}</td>
            <td style="padding: 14px; color: #4D6275;">${p.gender || 'Female'}, 28 yrs</td>
            <td style="padding: 14px; color: #034078; font-weight: 600;">📞 ${p.mobile}</td>
            <td style="padding: 14px;"><span style="background: #E8F0F7; color: #034078; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px;">${p.blood_group || 'O+'}</span></td>
            <td style="padding: 14px; color: #64748B;">Sept 15, 2026</td>
            <td style="padding: 14px; text-align: right;">
                <a href="./appointments.html" class="btn btn-outline btn-sm" style="font-size: 12px;">Consult History</a>
            </td>
        </tr>
    `).join('');
});
</script>
</body>
</html>
