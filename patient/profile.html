<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Medical Profile | ApoCare</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

<div class="dashboard-layout">
    <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

    <div class="dashboard-main">
        <header class="dashboard-topbar">
            <div class="topbar-left">
                <div class="topbar-page-title">Personal & Medical Profile</div>
            </div>
        </header>

        <main class="dashboard-content" style="max-width: 800px;">
            <div style="background: #FFFFFF; border: 1px solid #E1E8EE; border-radius: 20px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);">
                <form id="patientProfileForm">
                    <h3 style="font-size: 16px; font-weight: 800; color: #0A1128; margin: 0 0 16px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px;">General Information</h3>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div>
                            <label for="profName" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Full Name</label>
                            <input type="text" id="profName" required style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="profEmail" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Email (Primary Account)</label>
                            <input type="email" id="profEmail" readonly style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; background: #F8FAFC; outline: none; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div>
                            <label for="profMobile" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Mobile Number</label>
                            <input type="tel" id="profMobile" required style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="profDob" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Date of Birth</label>
                            <input type="date" id="profDob" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="profGender" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Gender</label>
                            <select id="profGender" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; box-sizing: border-box;">
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <h3 style="font-size: 16px; font-weight: 800; color: #0A1128; margin: 24px 0 16px; border-bottom: 1px solid #F1F5F9; padding-bottom: 8px;">Health & Security Information</h3>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px;">
                        <div>
                            <label for="profBlood" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Blood Group</label>
                            <select id="profBlood" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; background: #fff; box-sizing: border-box;">
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div>
                            <label for="profAadhaar" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Masked Aadhaar</label>
                            <input type="text" id="profAadhaar" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="profEmergency" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Emergency Contact</label>
                            <input type="tel" id="profEmergency" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                        <div>
                            <label for="profAllergies" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Known Drug Allergies</label>
                            <input type="text" id="profAllergies" placeholder="e.g. Penicillin, Sulfa" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                        <div>
                            <label for="profAddress" style="display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;">Residential Address</label>
                            <input type="text" id="profAddress" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="padding: 12px 28px; font-size: 14px; font-weight: 700; border-radius: 10px;">
                        Save Profile Updates
                    </button>
                </form>
            </div>
        </main>
    </div>
</div>

<!-- Core Scripts -->
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/dashboard.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!window.apoAuth.isLoggedIn()) window.apoAuth.loginDemo('patient');
    const user = window.apoAuth.getCurrentUser();
    window.apoDash.renderSidebar('patient', 'profile');

    const p = window.apoDB.getPatientProfile(user ? (user.patient_id || 1) : 1);
    if (p) {
        document.getElementById('profName').value = p.name || '';
        document.getElementById('profEmail').value = p.email || '';
        document.getElementById('profMobile').value = p.mobile || '';
        document.getElementById('profDob').value = p.date_of_birth || '';
        document.getElementById('profGender').value = p.gender || 'Female';
        document.getElementById('profBlood').value = p.blood_group || 'O+';
        document.getElementById('profAadhaar').value = p.aadhaar_masked || '';
        document.getElementById('profEmergency').value = p.emergency_contact || '';
        document.getElementById('profAllergies').value = p.allergies || '';
        document.getElementById('profAddress').value = p.address || '';
    }

    document.getElementById('patientProfileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const updates = {
            name: document.getElementById('profName').value.trim(),
            mobile: document.getElementById('profMobile').value.trim(),
            date_of_birth: document.getElementById('profDob').value,
            gender: document.getElementById('profGender').value,
            blood_group: document.getElementById('profBlood').value,
            aadhaar_masked: document.getElementById('profAadhaar').value.trim(),
            emergency_contact: document.getElementById('profEmergency').value.trim(),
            allergies: document.getElementById('profAllergies').value.trim(),
            address: document.getElementById('profAddress').value.trim()
        };

        window.apoDB.updatePatientProfile(user ? (user.patient_id || 1) : 1, updates);
        window.showToast('Medical profile updated successfully!', 'success');
    });
});
</script>
</body>
</html>
