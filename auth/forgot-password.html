<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ApoCare</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logo-icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: linear-gradient(180deg, #EDF4FA 0%, #FEFCFB 100%); min-height: 100vh; display: flex; flex-direction: column;">

<!-- Header Navigation Bar -->
<header class="header-navbar">
    <div class="container">
        <div class="nav-container">
            <a href="../index.html" class="brand-logo">
                <img src="../assets/images/logo.svg" alt="ApoCare" height="48">
            </a>

            <div class="nav-actions">
                <a href="./login.html" class="btn btn-outline btn-sm">Sign In</a>
            </div>
        </div>
    </div>
</header>

<div class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="background: #FFFFFF; border: 1px solid #E1E8EE; border-radius: 24px; padding: 36px; max-width: 440px; width: 100%; box-shadow: 0 15px 35px -5px rgba(10, 17, 40, 0.08);">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 48px; height: 48px; background: #E8F0F7; color: #034078; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px;">🔑</div>
            <h1 style="font-size: 22px; font-weight: 800; color: #0A1128; margin: 0 0 6px;">Reset Password</h1>
            <p style="color: #64748B; font-size: 14px; margin: 0;">Enter your registered email address to receive an instant verification link.</p>
        </div>

        <form id="forgotForm">
            <div style="margin-bottom: 18px;">
                <label for="resetEmail" style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Registered Email Address</label>
                <input type="email" id="resetEmail" required placeholder="name@example.com" value="riya.demo@example.com" style="width: 100%; padding: 12px 14px; border: 1.5px solid #CBD5E1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 14px; font-size: 15px; font-weight: 800; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(3, 64, 120, 0.3);">
                Send Password Reset OTP →
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748B;">
            Remembered password? <a href="./login.html" style="color: #034078; font-weight: 700; text-decoration: none;">Sign In</a>
        </div>
    </div>
</div>

<!-- Core Scripts -->
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    window.showToast(`Password reset link & OTP sent to ${email}! (Default demo password: Patient@123)`, 'success');
    setTimeout(() => {
        window.location.href = './login.html';
    }, 1500);
});
</script>
</body>
</html>
